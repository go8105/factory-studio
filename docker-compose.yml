name: factory-studio
services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: factory_studio
      POSTGRES_USER: factory_studio
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U factory_studio -d factory_studio"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  postgres_data:
