[project]
name = "factory-studio-backend"
version = "0.1.0"
requires-python = ">=3.14,<3.15"
dependencies = ["fastapi", "sqlalchemy>=2,<3", "alembic", "psycopg[binary]"]

[dependency-groups]
dev = ["pytest", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fs", "seed"]

[tool.ruff]
target-version = "py314"
