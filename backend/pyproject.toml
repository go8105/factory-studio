[project]
name = "factory-studio-backend"
version = "0.1.0"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi",
    "sqlalchemy>=2,<3",
    "alembic",
    "psycopg[binary]",
    "pyotp==2.9.0",
    "cryptography>=46,<49",
]

[dependency-groups]
dev = [
    "httpx",
    "pytest",
    "pytest-xdist>=3.8.0",
    "ruff",
    "uvicorn>=0.53.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fs", "seed"]

[tool.ruff]
target-version = "py314"

[tool.pytest.ini_options]
markers = ["perf: performance benchmark test"]
