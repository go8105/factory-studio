<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Factory Studio · UI Prototype</title><style>body{margin:0;padding:16px;background:#0b1016}button,input,select{min-height:36px}</style></head><body>
<style>
#factory-studio{--fs-bg:light-dark(#f4f6f8,#151d27);--fs-surface:light-dark(#fff,#202b38);--fs-ink:light-dark(#243449,#edf3fa);--fs-muted:light-dark(#627086,#b0bfd0);--fs-line:light-dark(#e0e6ed,#3a495a);--fs-accent:light-dark(#17675d,#82d5c5);--fs-tint:light-dark(#e6f3ef,#28453f);font-family:Inter,-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;color:var(--fs-ink);background:var(--fs-bg);border:1px solid var(--fs-line);border-radius:16px;overflow:hidden;color-scheme:light dark}
#factory-studio *{box-sizing:border-box}#factory-studio button,#factory-studio select{font:inherit;color:inherit;cursor:pointer}#factory-studio button{border:1px solid var(--fs-line);background:var(--fs-surface);border-radius:8px;padding:9px 12px}#factory-studio button:hover{border-color:var(--fs-accent)}#factory-studio button:disabled{opacity:.5;cursor:not-allowed}#factory-studio .fs-primary{background:var(--fs-accent);color:var(--fs-surface);border-color:var(--fs-accent)}#factory-studio .fs-top{display:flex;align-items:center;justify-content:space-between;padding:18px 22px;background:var(--fs-surface);gap:12px;flex-wrap:wrap;border-bottom:1px solid var(--fs-line)}#factory-studio .fs-logo{font-weight:500;letter-spacing:.05em}#factory-studio .fs-logo span{color:var(--fs-accent)}#factory-studio .fs-muted{color:var(--fs-muted)}#factory-studio .fs-pill{display:inline-block;background:var(--fs-tint);color:var(--fs-accent);padding:5px 9px;border-radius:6px}#factory-studio .fs-shell{display:grid;grid-template-columns:185px minmax(0,1fr)}#factory-studio aside{padding:24px 14px;background:var(--fs-surface);border-right:1px solid var(--fs-line)}#factory-studio .fs-nav{display:grid;gap:8px;margin:12px 0 28px}#factory-studio .fs-nav button{text-align:left;border-color:transparent;background:transparent}#factory-studio .fs-nav button[aria-current=page]{background:var(--fs-tint);color:var(--fs-accent)}#factory-studio main{padding:26px;min-width:0}#factory-studio h1{margin:8px 0 12px;font-weight:500}#factory-studio h2,#factory-studio h3{font-weight:500;margin:0 0 14px}#factory-studio p{margin:8px 0 18px}#factory-studio .fs-heading,#factory-studio .fs-row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}#factory-studio .fs-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-top:20px}#factory-studio .fs-panel{background:var(--fs-surface);border:1px solid var(--fs-line);border-radius:12px;padding:20px;min-width:0}#factory-studio .fs-wide{grid-column:1/-1}#factory-studio .fs-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:22px 0}#factory-studio .fs-number{display:block;margin:12px 0;font-weight:500;font-variant-numeric:tabular-nums}#factory-studio .fs-note{padding:12px 0;color:var(--fs-muted)}#factory-studio .fs-bars{display:grid;gap:17px}#factory-studio .fs-barline{display:grid;grid-template-columns:72px 1fr 85px;align-items:center;gap:10px}#factory-studio .fs-track{height:12px;background:var(--fs-bg);border-radius:4px;overflow:hidden}#factory-studio .fs-fill{height:100%;background:var(--fs-accent)}#factory-studio .fs-table{width:100%;border-collapse:collapse}#factory-studio .fs-table th,#factory-studio .fs-table td{text-align:left;padding:13px 8px;border-bottom:1px solid var(--fs-line);font-weight:400}#factory-studio .fs-tablewrap{overflow-x:auto}#factory-studio .fs-editor{display:flex;flex-wrap:wrap;gap:14px;padding:16px;background:var(--fs-surface);border:1px solid var(--fs-line);border-radius:10px;margin-top:16px}#factory-studio .fs-editor label{display:flex;gap:8px;align-items:center;padding:5px}#factory-studio input{accent-color:var(--fs-accent)}#factory-studio .fs-state{margin:16px 0 0;color:var(--fs-accent);min-height:24px}#factory-studio .fs-steps{display:flex;gap:8px;flex-wrap:wrap;margin:22px 0}#factory-studio .fs-step{padding:9px 12px;background:var(--fs-bg);border-radius:8px}#factory-studio .fs-step.done{background:var(--fs-tint);color:var(--fs-accent)}#factory-studio .fs-bottom{border-top:1px solid var(--fs-line);padding:12px 22px;background:var(--fs-surface);color:var(--fs-muted)}#factory-studio select{background:var(--fs-surface);border:1px solid var(--fs-line);border-radius:8px;padding:9px;max-width:100%}
@media(max-width:760px){#factory-studio .fs-shell{grid-template-columns:1fr}#factory-studio aside{border-right:0;border-bottom:1px solid var(--fs-line);padding:10px 16px}#factory-studio .fs-nav{display:flex;flex-wrap:wrap;margin:8px 0}#factory-studio aside .fs-muted{display:none}#factory-studio main{padding:18px}#factory-studio .fs-stats{grid-template-columns:1fr}#factory-studio .fs-grid{grid-template-columns:1fr}#factory-studio .fs-top{padding:16px}#factory-studio .fs-barline{grid-template-columns:64px 1fr 80px}}

#factory-studio{--fs-bg:#0c1117;--fs-surface:#171d25;--fs-ink:#e3eaf2;--fs-muted:#9ca9b9;--fs-line:#2a323c;--fs-accent:#68d8cf;--fs-tint:#163634;color-scheme:dark}
#factory-studio .fs-logo{display:flex;align-items:center;gap:12px;border:0;padding:0;background:transparent}
#factory-studio .fs-logo span{display:inline-grid;place-items:center;width:36px;height:36px;border-radius:9px;background:linear-gradient(135deg,#10c5b0,#2a98ed);color:#09141b}
#factory-studio[data-home=true] .fs-shell{grid-template-columns:minmax(0,1fr)}
#factory-studio[data-home=true] aside{display:none}
#factory-studio .fs-launcher{max-width:1120px;margin:20px auto 64px}
#factory-studio .fs-launch-tools{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:28px}
#factory-studio .fs-launch-tools input{background:var(--fs-surface);color:var(--fs-ink);border:1px solid var(--fs-line);border-radius:9px;padding:12px;font:inherit;width:250px;max-width:100%}
#factory-studio .fs-app-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border:1px solid var(--fs-line);border-radius:14px;overflow:hidden;gap:1px;background:var(--fs-line)}
#factory-studio .fs-app{border:0;border-radius:0;background:var(--fs-bg);padding:30px 16px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px;min-width:0}
#factory-studio .fs-app:hover{background:var(--fs-surface)}
#factory-studio .fs-app:disabled{opacity:1;cursor:default}
#factory-studio .fs-app:disabled .fs-app-icon{filter:grayscale(.5);opacity:.65}
#factory-studio .fs-app-icon{font-size:36px;line-height:1.3}
#factory-studio .fs-app-name{font-size:20px;font-weight:500}
#factory-studio .fs-app-description{max-width:190px;min-height:44px;color:var(--fs-muted)}
#factory-studio .fs-app-status{border:1px solid #28553e;background:#112b20;color:#7bdaa3;padding:4px 9px;border-radius:4px}
#factory-studio .fs-app-status.off{border-color:var(--fs-line);background:var(--fs-surface);color:var(--fs-muted)}
#factory-studio .fs-app-grid [hidden]{display:none}
#factory-studio .fs-launch-footer{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:16px;margin-top:24px}
#factory-studio .fs-launch-empty{padding:24px;text-align:center;color:var(--fs-muted)}
@media(min-width:1300px){#factory-studio .fs-app-grid{grid-template-columns:repeat(6,minmax(0,1fr))}}
@media(max-width:540px){#factory-studio .fs-app-grid{grid-template-columns:repeat(2,minmax(0,1fr))}#factory-studio .fs-app{padding:24px 10px}#factory-studio .fs-launcher{margin-top:8px}#factory-studio .fs-launch-tools input{width:100%}}
</style>
<div id="factory-studio" aria-label="Factory Studio 인터페이스 시제품">
<header class="fs-top"><button type="button" class="fs-logo" data-page="home" aria-label="Factory Studio 모든 앱"><span>F</span> FACTORY STUDIO</button><div class="fs-row"><span class="fs-muted">한빛 패키징 · 가상 사업장</span><span class="fs-pill">개인 체험 공간</span></div></header>
<div class="fs-shell"><aside><span class="fs-muted">WORKSPACE</span><nav id="fs-nav" class="fs-nav" aria-label="주 메뉴"></nav><span class="fs-muted">학습용 합성 데이터<br>반도체 후공정 · Line A</span></aside><main><div id="fs-page"></div><div id="fs-status" class="fs-state" role="status" aria-live="polite"></div></main></div>
<footer class="fs-bottom">UI 시제품 · 실제 서버 연결 없음 · 변경 사항은 이 미리보기를 닫으면 초기화됩니다.</footer>
</div>
<script>
(()=>{
const root=document.getElementById('factory-studio');
const modules=[{id:'mes',name:'MES',title:'생산 관리',desc:'작업지시, LOT 진행, 양품·불량 실적',dep:'공통 기반',ready:true},{id:'fems',name:'FEMS',title:'제조 에너지',desc:'설비별 전력량, 생산 연계 원단위',dep:'공통 기반 · MES 연결은 선택',ready:true},{id:'bems',name:'BEMS',title:'건물 에너지',desc:'공조·조명·공용시설 에너지',dep:'공통 기반',ready:true},{id:'qms',name:'QMS',title:'품질 관리',desc:'검사, LOT 보류·해제, 불량 추적',dep:'후속 버전 · LOT 연계 시 MES 필요',ready:false},{id:'wms',name:'WMS',title:'창고 관리',desc:'입출고, 재고 원장, LOT 추적',dep:'후속 버전',ready:false},{id:'erp',name:'ERP',title:'경영 관리',desc:'주문, 매입매출, 수금지급, 기초회계',dep:'후속 버전',ready:false}];
const state={page:'home',enabled:{mes:true,fems:true,bems:true},widgets:{production:true,energy:true,building:true,intensity:true},editing:false,stage:0,notice:'',reverse:false};
const design={rounded:true,dense:false};
const appIcons={erp:'🏢',mes:'⚙️',wms:'📦',qms:'🔬',fems:'⚡',bems:'🏙️'};
const appEnglish={erp:'Enterprise Resource Planning',mes:'Manufacturing Execution System',wms:'Warehouse Management System',qms:'Quality Management System',fems:'Factory Energy Management System',bems:'Building Energy Management System'};
const titles={home:'모든 앱',overview:'통합 대시보드',modules:'모듈 라이브러리',mes:'생산 관리',fems:'제조 에너지',bems:'건물 에너지'};
const widgetNames={production:'생산 진행',energy:'설비 전력량',building:'건물 에너지',intensity:'생산 원단위'};
const usable=k=>({production:state.enabled.mes,energy:state.enabled.fems,building:state.enabled.bems,intensity:state.enabled.mes&&state.enabled.fems})[k];
const action=(label,attr,primary=false)=>`<button type="button" ${attr} class="${primary?'fs-primary':''}">${label}</button>`;
function bars(rows){return `<div class="fs-bars">${rows.map(([name,value,max])=>`<div class="fs-barline"><span>${name}</span><div class="fs-track"><div class="fs-fill" style="width:${100*value/max}%"></div></div><span>${value} kWh</span></div>`).join('')}</div>`;}
function lot(){return `<div class="fs-tablewrap"><table class="fs-table"><thead><tr><th>LOT / 품목</th><th>현재 공정</th><th>상태</th></tr></thead><tbody><tr><td>LOT-260914-01<br><span class="fs-muted">QFN-48 · 1,000 ea</span></td><td>최종 검사</td><td><span class="fs-pill">완료</span></td></tr><tr><td>LOT-260914-02<br><span class="fs-muted">QFN-48 · 1,000 ea</span></td><td>${['다이 접착','다이 접착','와이어 본딩'][state.stage]}</td><td>${['대기','진행 중','공정 완료'][state.stage]}</td></tr></tbody></table></div>`;}
function widget(k){const content={production:`${lot()}<div class="fs-note">가상 공정의 상태 전이를 체험하세요.</div>${action('생산 화면 열기','data-page="mes"')}`,energy:bars([['접착 설비',96,160],['본딩 설비',144,160],['검사 설비',48,160]])+'<div class="fs-note">09:00–12:00 · 직접 계측 예시</div>',building:bars([['공조',84,100],['조명',24,100],['기타 공용',24,100]])+'<div class="fs-note">제조 계측과 겹치지 않는 공용 범위</div>',intensity:'<span class="fs-number">0.294 kWh / 양품 ea</span><p class="fs-muted">완료 LOT-260914-01 · QFN-48</p><div class="fs-note">배분 전력량 288 kWh ÷ 양품 980 ea<br>09:00–12:00 · 배분 추정값</div>'};return `<section class="fs-panel"><div class="fs-heading"><h3>${widgetNames[k]}</h3>${state.editing?action('숨기기',`data-hide="${k}"`):''}</div>${content[k]}</section>`;}
function home(){return `<section class="fs-launcher"><div class="fs-launch-tools"><div><span class="fs-muted">WORKSPACE / APPLICATIONS</span><h1>나의 업무 공간</h1></div><input id="fs-search" type="search" placeholder="모듈 검색…" aria-label="모듈 검색"></div><div class="fs-app-grid">${['erp','mes','wms','qms','fems','bems'].map(id=>{const m=modules.find(x=>x.id===id);const active=m.ready&&state.enabled[id];return `<button type="button" class="fs-app" data-app="${id}" data-search="${m.name} ${m.title} ${appEnglish[id]}" ${m.ready?`data-page="${active?id:'modules'}"`:'disabled'} aria-label="${m.name} ${m.title} ${active?'열기':m.ready?'활성화 설정':'준비 중'}"><span class="fs-app-icon" aria-hidden="true">${appIcons[id]}</span><span class="fs-app-name">${m.name}</span><span class="fs-muted">${m.title}</span><span class="fs-app-description">${appEnglish[id]}</span><span class="fs-app-status ${active?'':'off'}">${active?'사용 중':m.ready?'비활성 · 설정':'준비 중'}</span></button>`;}).join('')}</div><div id="fs-empty" class="fs-launch-empty" hidden>일치하는 모듈이 없습니다.</div><div class="fs-launch-footer"><span class="fs-muted">하나의 사업장 · 연결된 업무 데이터</span><div class="fs-row">${action('통합 대시보드','data-page="overview"')}${action('모듈 관리','data-page="modules"')}</div></div></section>`;}
function overview(){let widgets=Object.keys(state.widgets).filter(k=>state.widgets[k]&&usable(k));if(state.reverse)widgets.reverse();return `<div class="fs-heading"><div><span class="fs-muted">OVERVIEW / 2026.09.14 · 09:00–12:00</span><h1>우리 사업장, 한눈에</h1></div>${action(state.editing?'편집 완료':'대시보드 편집','data-edit',true)}</div><p class="fs-muted">생산 흐름과 에너지 사용을 하나의 작업 공간에서 확인하세요.</p>${state.editing?`<div class="fs-editor">${Object.keys(widgetNames).map(k=>`<label><input type="checkbox" data-widget="${k}" ${state.widgets[k]?'checked':''} ${usable(k)?'':'disabled'}>${widgetNames[k]}${usable(k)?'':' (모듈 필요)'}</label>`).join('')}${action('위젯 순서 뒤집기','data-order')}</div>`:''}<div class="fs-stats"><div class="fs-panel"><span class="fs-muted">완료 LOT 양품</span><span class="fs-number">${state.enabled.mes?'980 ea':'MES 비활성'}</span><span class="fs-muted">${state.enabled.mes?'총 생산 1,000 · 불량 20':'모듈을 켜면 표시됩니다'}</span></div><div class="fs-panel"><span class="fs-muted">제조 에너지</span><span class="fs-number">${state.enabled.fems?'288 kWh':'FEMS 비활성'}</span><span class="fs-muted">선택 기간 · 직접 계측</span></div><div class="fs-panel"><span class="fs-muted">건물 공용 에너지</span><span class="fs-number">${state.enabled.bems?'132 kWh':'BEMS 비활성'}</span><span class="fs-muted">제조 계측 범위 제외</span></div></div><div class="fs-grid">${widgets.map(widget).join('')||'<div class="fs-panel fs-wide">표시할 위젯이 없습니다. 모듈을 켜고 대시보드 편집에서 위젯을 선택하세요.</div>'}</div>`;}
function library(){return `<span class="fs-muted">YOUR WORKSPACE / APPS</span><h1>필요한 업무만 연결하세요</h1><p class="fs-muted">모듈을 끄면 메뉴와 위젯이 숨겨지고, 체험 데이터는 유지됩니다.</p><label>빠른 구성 <select id="fs-preset"><option value="">구성 선택</option><option value="all">생산 + 에너지 통합</option><option value="energy">에너지 관리</option><option value="production">생산 관리</option></select></label><div class="fs-grid">${modules.map(m=>`<section class="fs-panel"><div class="fs-row"><span class="fs-pill">${m.name}</span><span class="fs-muted">${m.ready?(state.enabled[m.id]?'사용 중':'사용 안 함'):'준비 중'}</span></div><h2 style="margin-top:18px">${m.title}</h2><p class="fs-muted">${m.desc}</p><div class="fs-note">${m.dep}</div>${m.ready?action(state.enabled[m.id]?'비활성화':'활성화',`data-toggle="${m.id}"`,!state.enabled[m.id]):'<button type="button" disabled>후속 버전에서 제공</button>'}</section>`).join('')}</div>`;}
function mes(){return `<span class="fs-muted">MES / LOT EXECUTION</span><h1>생산 흐름을 따라가세요</h1><p class="fs-muted">LOT-260914-02 · QFN-48 · 계획 1,000 ea</p><section class="fs-panel"><div class="fs-row"><h2>다이 접착</h2><span class="fs-pill">${['대기','작업 중','공정 완료'][state.stage]}</span></div><div class="fs-steps">${['작업 대기','공정 시작','공정 완료'].map((x,i)=>`<span class="fs-step ${i<=state.stage?'done':''}">${i+1}. ${x}</span>`).join('')}</div><p>설비 DA-01 · 작업지시 WO-260914-02</p>${state.stage<2?action(state.stage===0?'공정 시작':'공정 완료', 'data-advance',true):'<p class="fs-muted">다이 접착이 완료되었습니다. 다음 공정: 와이어 본딩</p>'}</section><div class="fs-grid"><section class="fs-panel fs-wide"><h3>LOT 현황</h3>${lot()}</section></div>`;}
function energy(building){return `<span class="fs-muted">${building?'BEMS':'FEMS'} / ENERGY</span><h1>${building?'건물 공용 에너지':'제조 에너지'}</h1><p class="fs-muted">2026.09.14 · 09:00–12:00 · 가상 계측 데이터</p><div class="fs-grid">${building?widget('building'):widget('energy')}${!building&&state.enabled.mes?widget('intensity'):''}<section class="fs-panel fs-wide"><h3>집계 범위</h3><p>${building?'공조·조명·공용시설만 집계합니다.':'제조 설비 하위 계측기만 집계합니다.'}</p><div class="fs-note">${state.enabled.fems&&state.enabled.bems?'사업장 주계량기 450 kWh = 제조 288 + 건물 공용 132 + 미계측 잔여 30 kWh':'통합 대사는 FEMS와 BEMS를 모두 켜면 표시됩니다.'}</div>${!building&&!state.enabled.mes?'<p class="fs-muted">MES를 활성화하면 생산량당 에너지 분석을 함께 볼 수 있습니다.</p>':''}</section></div>`;}
function render(){root.dataset.home=String(state.page==='home');root.querySelector('#fs-nav').innerHTML=['home','overview','modules',...modules.filter(m=>state.enabled[m.id]).map(m=>m.id)].map(k=>`<button type="button" data-page="${k}" ${state.page===k?'aria-current="page"':''}>${titles[k]}</button>`).join('');root.querySelector('#fs-page').innerHTML=state.page==='home'?home():state.page==='overview'?overview():state.page==='modules'?library():state.page==='mes'?mes():energy(state.page==='bems');root.querySelector('#fs-status').textContent=state.notice;}
root.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;state.notice='';if(b.dataset.page){state.page=b.dataset.page;state.editing=false;}else if(b.hasAttribute('data-edit'))state.editing=!state.editing;else if(b.dataset.toggle){const k=b.dataset.toggle;state.enabled[k]=!state.enabled[k];state.notice=`${k.toUpperCase()} ${state.enabled[k]?'활성화':'비활성화'} 완료. 체험 데이터는 유지됩니다.`;}else if(b.dataset.hide)state.widgets[b.dataset.hide]=false;else if(b.hasAttribute('data-order'))state.reverse=!state.reverse;else if(b.hasAttribute('data-advance')){state.stage=Math.min(2,state.stage+1);state.notice=state.stage===1?'다이 접착 공정을 시작했습니다.':'다이 접착 공정을 완료했습니다.';}render();});
root.addEventListener('input',e=>{if(e.target.id!=='fs-search')return;const q=e.target.value.trim().toLowerCase();let count=0;root.querySelectorAll('[data-app]').forEach(el=>{el.hidden=!el.dataset.search.toLowerCase().includes(q);if(!el.hidden)count++;});root.querySelector('#fs-empty').hidden=count>0;});
root.addEventListener('change',e=>{if(e.target.dataset.widget){state.widgets[e.target.dataset.widget]=e.target.checked;render();}else if(e.target.id==='fs-preset'&&e.target.value){const v=e.target.value;state.enabled={mes:v!=='energy',fems:v!=='production',bems:v!=='production'};state.notice='선택한 구성을 적용했습니다. 통합 대시보드에서 확인하세요.';render();}});
render();
if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:()=>{root.style.borderRadius=design.rounded?'16px':'0';root.querySelector('main').style.padding=design.dense?'16px':'26px';}});tweak.addToggle(design,'rounded',{label:'둥근 창 모서리'});tweak.addToggle(design,'dense',{label:'조밀한 화면 간격'});}
})();
</script>

</body></html>
