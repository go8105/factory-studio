<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Factory Flow 간결 보드 검토</title><style>
:root{--canvas:#F7F7F6;--border:#E8E8E6;--ink:#1A1C1E;--muted:#5D6166;--point:#1F2D3D;--sub:#2D4442}*{box-sizing:border-box}body{margin:0;font:14px system-ui,sans-serif;color:var(--ink);background:var(--canvas)}button,input,select{font:inherit}button{cursor:pointer;color:inherit;background:white;border:1px solid var(--border);border-radius:6px;padding:9px 12px}button:hover{background:#eceeed}button:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--point);outline-offset:2px}input,select{padding:7px;border:1px solid var(--border);border-radius:4px;background:white;color:inherit}aside{position:fixed;width:250px;inset:0 auto 0 0;background:white;border-right:1px solid var(--border);padding:20px 12px;overflow:auto}aside h2{font-size:18px;margin:0 8px 26px}aside button{border:0;width:100%;text-align:left;display:flex;align-items:center;gap:10px;min-height:44px;margin-bottom:5px}aside .label{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}aside h4{font-size:12px;color:var(--muted);margin:24px 10px 10px}.active{background:var(--point)!important;color:white}main{margin-left:250px}header{height:60px;border-bottom:1px solid var(--border);background:white;padding:18px 32px;display:flex;justify-content:space-between;color:var(--muted)}article{padding:30px 36px}.notice{font-size:12px;color:var(--muted);margin-bottom:20px}h1{font-size:27px;margin:0 0 8px}.description{color:var(--muted)}.tabs{border-bottom:1px solid var(--border);margin-top:28px;padding:15px 0;font-weight:600}.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:20px 0}.primary{background:var(--point);color:white;border-color:var(--point)}.primary:hover{background:#354557}.toolbar input{width:260px}.right{margin-left:auto}.group{margin:22px 0}.grouphead{display:flex;align-items:center;gap:8px;color:var(--color);margin-bottom:9px}.grouphead strong{font-size:18px}.grouphead button{border:0;background:transparent}.grouphead .count{color:var(--muted);font-size:12px}.scroll{overflow:auto;background:white;border:1px solid var(--border);border-left:5px solid var(--color);border-radius:5px}table{border-collapse:collapse;min-width:1080px;width:100%}th,td{border-bottom:1px solid var(--border);border-right:1px solid var(--border);height:48px;padding:7px 10px;text-align:left;font-weight:400}th{background:#f0f1f0;color:var(--muted);text-align:center;white-space:nowrap}th button{border:0;background:transparent;padding:5px}td:first-child{width:42px;text-align:center}.name{min-width:300px;display:flex;align-items:center;gap:7px}.name input,.celltext{border:1px solid transparent;min-width:100px;width:100%;background:transparent}.name input:hover,.celltext:hover{border-color:var(--border)}.name button{border:0;padding:5px}.subrow .name{padding-left:32px}.status{min-width:105px;border:0;background:#e8eeeb;color:var(--sub);width:100%}.status.working{background:#e9edf0;color:var(--point)}.status.waiting{background:#efefee;color:var(--muted)}.avatar{background:#E2E3E5;border-radius:50%;padding:6px;color:var(--point)}details{position:relative}summary{cursor:pointer;list-style:none;padding:8px}.menu{position:absolute;right:0;top:35px;min-width:205px;z-index:6;padding:6px;background:white;border:1px solid var(--border);border-radius:8px;box-shadow:0 2px 6px #1a1c1e0a}.menu button{display:block;width:100%;text-align:left;border:0}.star{border:0;background:transparent;color:#9e8147;font-size:23px;padding:0 8px}.drawer{position:fixed;right:0;top:0;width:min(440px,100%);height:100vh;z-index:8;background:white;padding:26px;border-left:1px solid var(--border);box-shadow:0 2px 6px #1a1c1e0a;overflow:auto}textarea{width:100%;height:130px;font:inherit;padding:12px;border:1px solid var(--border);margin:12px 0}.collapsed aside{width:66px}.collapsed aside h2,.collapsed aside h4,.collapsed aside .label{display:none}.collapsed aside button{justify-content:center;padding:8px}.collapsed main{margin-left:66px}.empty{padding:30px;color:var(--muted)}dialog{border:1px solid var(--border);border-radius:12px;width:min(480px,95vw);padding:24px}dialog::backdrop{background:#1a1c1e33}dialog label{display:block;margin:15px 0}dialog input,dialog select{width:100%;margin-top:5px}.toast{position:fixed;bottom:20px;right:20px;background:var(--point);color:white;padding:12px 20px;border-radius:8px;z-index:15}@media(max-width:720px){aside{width:66px}aside h2,aside h4,aside .label{display:none}aside button{justify-content:center;padding:8px}main{margin-left:66px}header{padding:15px}article{padding:20px 12px}h1{font-size:22px}.toolbar input{width:100%}.right{margin-left:0}.grouphead .count{display:none}button,summary{min-height:44px}}
</style><aside><h2>Factory Flow</h2><button id="collapse" title="사이드바 축소">☰ <span class="label">사이드바 축소</span></button><button data-nav="home" title="홈">⌂ <span class="label">홈</span></button><button data-nav="my" title="내 작업">▤ <span class="label">내 작업</span></button><h4>즐겨찾기</h4><div id="favorites"></div><h4>최근 본 항목</h4><div id="recent"></div><h4>관리</h4><button data-nav="users" title="사용자 관리">♙ <span class="label">사용자 관리</span></button><button id="newBoard" title="새 보드">＋ <span class="label">새 보드</span></button></aside><main><header><span>프로젝트 보드</span><span>검토용 예시 · 실제 저장 없음</span></header><article id="content"></article></main><dialog id="columnDialog"><h2>컬럼 추가</h2><form id="columnForm"><label>컬럼 이름<input name="name" maxlength="120" required></label><label>유형<select name="kind"><option value="text">텍스트</option><option value="number">숫자</option><option value="date">날짜</option><option value="status">상태</option><option value="check">체크박스</option><option value="range">기간</option></select></label><button type="button" onclick="columnDialog.close()">취소</button> <button class="primary">추가</button></form></dialog><script>
const $=s=>document.querySelector(s);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let serial=30,view='board',query='',mine=false,filter='',boardId=1;
const row=(name,person,state,children=[])=>({id:++serial,name,person,state,children,values:{},comments:[],open:true});
let boards=[{id:1,name:'설비 개선 프로젝트',favorite:true,columns:[],groups:[{id:1,name:'계획 · 검토',color:'#40566a',open:true,rows:[row('현장 요구사항 정리','김현우','완료'),row('개선 범위 및 일정 확정','박서연','검토')]},{id:2,name:'실행 · 검증',color:'#625968',open:true,rows:[row('장비 점검 및 시운전','이도윤','진행 중',[row('점검 체크리스트 작성','김현우','진행 중'),row('센서 데이터 정합성 확인','최지우','대기')])]}]},{id:2,name:'팀 주간 업무',favorite:true,columns:[],groups:[{id:3,name:'이번 주 업무',color:'#2D4442',open:true,rows:[row('주간 업무 공유','김현우','대기')]}]},{id:3,name:'회의 후속 업무',favorite:false,columns:[],groups:[]}];let recent=[1,2,3];const board=()=>boards.find(b=>b.id===boardId);function toast(t){$('.toast')?.remove();let e=document.createElement('div');e.className='toast';e.textContent=t;document.body.append(e);setTimeout(()=>e.remove(),2500)}function nav(){const buttons=bs=>bs.map(b=>`<button data-board="${b.id}" class="${view==='board'&&b.id===boardId?'active':''}" title="${esc(b.name)}">▦ <span class="label">${esc(b.name)}</span></button>`).join('');$('#favorites').innerHTML=buttons(boards.filter(b=>b.favorite));$('#recent').innerHTML=buttons(recent.map(id=>boards.find(b=>b.id===id)).filter(Boolean));}
function showBoard(id){boardId=id;view='board';recent=[id,...recent.filter(x=>x!==id)].slice(0,10);render()}
const menu=(items)=>`<details><summary aria-label="메뉴">•••</summary><div class="menu">${items.map(([label,act])=>`<button data-act="${act}">${label}</button>`).join('')}</div></details>`;
function rowsHTML(g,rows,sub=false){return rows.filter(r=>!r.deleted&&!r.archived&&(!query||r.name.includes(query)||r.person.includes(query))&&(!mine||r.person==='김현우')&&(!filter||r.state===filter)).map(r=>`<tr class="${sub?'subrow':''}" data-row="${r.id}"><td><input type="checkbox" aria-label="아이템 선택"></td><td><div class="name">${!sub?`<button data-act="row-toggle" title="하위 아이템 펼치기">${r.children.length?(r.open?'⌄':'›'):'·'}</button>`:''}<input data-edit="name" value="${esc(r.name)}" aria-label="아이템 이름"><button data-act="comments" title="업데이트">▱ ${r.comments.length}</button></div></td><td><input class="celltext" data-edit="person" value="${esc(r.person)}" aria-label="담당자"></td><td><select class="status ${r.state==='대기'?'waiting':r.state==='진행 중'?'working':''}" data-edit="state">${['대기','진행 중','검토','완료'].map(s=>`<option ${r.state===s?'selected':''}>${s}</option>`).join('')}</select></td><td><input type="date" data-edit="date" value="${r.date||''}" aria-label="일정"></td><td><select data-edit="priority">${['보통','중요','매우 중요'].map(s=>`<option ${r.priority===s?'selected':''}>${s}</option>`).join('')}</select></td>${board().columns.filter(c=>!c.deleted).map(c=>`<td>${cell(r,c)}</td>`).join('')}<td>${menu(sub?[['아이템 삭제','row-delete']]:[['하위 아이템 추가','sub-add'],['아이템 삭제','row-delete']])}</td></tr>${r.open?rowsHTML(g,r.children,true):''}`).join('')}
function cell(r,c){let v=r.values[c.id]??'';return c.kind==='status'?`<select data-cell="${c.id}">${['대기','진행 중','완료'].map(s=>`<option ${v===s?'selected':''}>${s}</option>`).join('')}</select>`:c.kind==='range'?`<input data-cell="${c.id}" type="date" data-part="start" value="${esc(v.start||'')}" aria-label="시작일"><input data-cell="${c.id}" type="date" data-part="end" value="${esc(v.end||'')}" aria-label="종료일">`:`<input class="celltext" data-cell="${c.id}" type="${{text:'text',number:'number',date:'date',check:'checkbox'}[c.kind]}" ${c.kind==='check'?(v?'checked':''):`value="${esc(v)}"`} aria-label="${esc(c.name)}">`}
function render(){nav();const b=board();if(view==='users'){renderUsers();return}if(view==='home'){ $('#content').innerHTML='<h1>내 업무 공간</h1><p class="description">즐겨찾기에서 보드를 선택하세요.</p>'+boards.map(b=>`<p><button data-board="${b.id}">▦ ${esc(b.name)}</button></p>`).join('');return}$('#content').innerHTML=`<div class="notice">검토 화면입니다. 그룹·아이템 이름 편집, 컬럼 추가, 삭제·복구를 눌러볼 수 있습니다.</div><h1><span contenteditable="true" data-boardname>${esc(b.name)}</span> <button class="star" data-act="favorite" aria-label="즐겨찾기">${b.favorite?'★':'☆'}</button></h1><p class="description">그룹별로 업무를 묶고, 필요한 컬럼으로 관리하세요.</p><div class="tabs">▦ 메인 테이블</div><div class="toolbar"><button class="primary" data-act="item-add">＋ 새로운 아이템</button><input id="search" placeholder="업무 또는 담당자 검색" value="${esc(query)}"><button data-act="mine" ${mine?'class="active"':''}>♙ 내 작업</button><select id="filter" aria-label="상태 필터">${['','대기','진행 중','검토','완료'].map(s=>`<option value="${s}" ${filter===s?'selected':''}>${s||'전체 상태'}</option>`).join('')}</select><button data-act="collapse-all">모든 그룹 접기</button><button data-act="expand-all">펼치기</button><button class="right" data-act="trash">휴지통</button></div>${b.groups.filter(g=>!g.deleted&&!g.archived).map(g=>`<section class="group" data-group="${g.id}" style="--color:${g.color}"><div class="grouphead"><button data-act="toggle">${g.open?'⌄':'›'}</button><strong contenteditable="true" data-groupname>${esc(g.name)}</strong><span class="count">${g.rows.filter(r=>!r.deleted&&!r.archived).length} 아이템</span><div class="right">${menu([['그룹 이름 바꾸기','rename'],['그룹 색상 변경','color'],['그룹 복제','duplicate'],['위로 이동','up'],['아래로 이동','down'],['하위 아이템 모두 펼치기','sub-expand'],['하위 아이템 모두 접기','sub-collapse'],['그룹 보관','archive'],['그룹 삭제','delete']])}</div></div>${g.open?`<div class="scroll"><table><thead><tr><th>□</th><th>아이템</th><th>담당자</th><th>상태</th><th>일정</th><th>업무 중요도</th>${b.columns.filter(c=>!c.deleted).map(c=>`<th data-column="${c.id}"><span contenteditable="true" data-columnname>${esc(c.name)}</span>${menu([['왼쪽으로 이동','column-left'],['오른쪽으로 이동','column-right'],['컬럼 삭제','column-delete']])}</th>`).join('')}<th><button data-act="column-add">＋</button></th></tr></thead><tbody>${rowsHTML(g,g.rows)}<tr><td></td><td colspan="${6+b.columns.filter(c=>!c.deleted).length}"><button data-act="group-item-add">＋ 아이템 추가</button></td></tr></tbody></table></div>`:`<div class="scroll empty">그룹을 펼쳐 아이템을 편집하세요.</div>`}</section>`).join('')}<button data-act="group-add">＋ 새 그룹 추가하기</button>`;}
function ask(message,initial,yesno=false){return new Promise(resolve=>{let d=document.createElement('dialog');d.innerHTML=`<h3>${esc(message)}</h3>${yesno?'':`<label>입력<input aria-label="입력" value="${esc(initial||'')}"></label>`}<button data-cancel>취소</button> <button class="primary" data-ok>확인</button>`;document.body.append(d);let done=v=>{d.close();d.remove();resolve(v)};d.querySelector('[data-ok]').onclick=()=>done(yesno?true:d.querySelector('input').value);d.querySelector('[data-cancel]').onclick=()=>done(yesno?false:null);d.oncancel=e=>{e.preventDefault();done(yesno?false:null)};d.showModal()})}function findRow(id){for(const g of board().groups){const r=[...g.rows,...g.rows.flatMap(r=>r.children)].find(r=>r.id===id);if(r)return r}}
document.addEventListener('click',async e=>{const bt=e.target.closest('[data-board]');if(bt){showBoard(+bt.dataset.board);return}const nv=e.target.closest('[data-nav]');if(nv){view=nv.dataset.nav;if(view==='my'){view='board';mine=true}render();return}const el=e.target.closest('[data-act]');if(!el)return;const act=el.dataset.act,b=board(),g=b.groups.find(g=>g.id===+el.closest('[data-group]')?.dataset.group),r=findRow(+el.closest('[data-row]')?.dataset.row),c=b.columns.find(c=>c.id===+el.closest('[data-column]')?.dataset.column);el.closest('details')?.removeAttribute('open');if(act==='favorite')b.favorite=!b.favorite;if(act==='mine')mine=!mine;if(act==='toggle')g.open=!g.open;if(act==='collapse-all'||act==='expand-all')b.groups.forEach(g=>g.open=act==='expand-all');if(act==='group-add')b.groups.push({id:++serial,name:'새 그룹',color:'#8c7450',open:true,rows:[]});if(act==='item-add'||act==='group-item-add'){const target=g||b.groups.find(g=>!g.deleted&&!g.archived);if(!target){toast('먼저 그룹을 추가하세요');return}target.open=true;target.rows.push(row('새 아이템','김현우','대기'))}if(act==='rename'){const t=el.closest('[data-group]').querySelector('[data-groupname]');t.focus();document.execCommand('selectAll',false,null);return}if(act==='color'){let v=await ask('그룹 색상 (#RRGGBB)',g.color);if(v&&/^#[0-9a-f]{6}$/i.test(v))g.color=v}if(act==='up'||act==='down'){let i=b.groups.indexOf(g),j=i+(act==='up'?-1:1);if(j>=0&&j<b.groups.length)[b.groups[i],b.groups[j]]=[b.groups[j],b.groups[i]]}if(act==='duplicate'){let copy=structuredClone(g);copy.id=++serial;copy.name+=' 복사';for(const r of copy.rows){r.id=++serial;r.comments=[];for(const s of r.children){s.id=++serial;s.comments=[]}}b.groups.splice(b.groups.indexOf(g)+1,0,copy)}if(act==='sub-expand'||act==='sub-collapse')g.rows.forEach(r=>r.open=act==='sub-expand');if(act==='delete'||act==='archive'){if(await ask('그룹을 '+(act==='delete'?'휴지통으로 이동':'보관')+'할까요? 복구할 수 있습니다.',null,true))g[act==='delete'?'deleted':'archived']=true}if(act==='row-toggle')r.open=!r.open;if(act==='sub-add'){if(r.children===undefined)return;r.open=true;r.children.push(row('새 하위 아이템','김현우','대기'))}if(act==='row-delete'&&await ask('아이템을 휴지통으로 이동할까요?',null,true))r.deleted=true;if(act==='column-add'){columnDialog.showModal();return}if(act==='column-delete'&&await ask('컬럼을 휴지통으로 이동할까요? 값은 보존합니다.',null,true))c.deleted=true;if(act==='column-left'||act==='column-right'){let i=b.columns.indexOf(c),j=i+(act==='column-left'?-1:1);if(j>=0&&j<b.columns.length)[b.columns[i],b.columns[j]]=[b.columns[j],b.columns[i]]}if(act==='comments'){drawer(r);return}if(act==='trash'){trash();return}render()});
document.addEventListener('change',e=>{let r=findRow(+e.target.closest('[data-row]')?.dataset.row);if(e.target.dataset.edit&&r){r[e.target.dataset.edit]=e.target.value;if(e.target.dataset.edit==='state')render()}if(e.target.dataset.cell&&r){let id=e.target.dataset.cell;if(e.target.dataset.part){r.values[id]||={};r.values[id][e.target.dataset.part]=e.target.value}else r.values[id]=e.target.type==='checkbox'?e.target.checked:e.target.value}if(e.target.id==='filter'){filter=e.target.value;render()}});document.addEventListener('input',e=>{if(e.target.id==='search'){query=e.target.value;let pos=e.target.selectionStart;render();$('#search').focus();$('#search').setSelectionRange(pos,pos)}});
document.addEventListener('focusin',e=>{if(e.target.matches('[contenteditable],[data-edit="name"]'))e.target.dataset.original=e.target.value??e.target.textContent});document.addEventListener('focusout',e=>{let t=e.target;if(t.matches('[data-boardname]')){let v=t.textContent.trim();board().name=v||t.dataset.original;nav();t.textContent=board().name}if(t.matches('[data-groupname]')){let g=board().groups.find(g=>g.id===+t.closest('[data-group]').dataset.group);g.name=t.textContent.trim()||t.dataset.original;t.textContent=g.name}if(t.matches('[data-columnname]')){let c=board().columns.find(c=>c.id===+t.closest('[data-column]').dataset.column);c.name=t.textContent.trim()||t.dataset.original;t.textContent=c.name}if(t.matches('[data-edit="name"]')){let r=findRow(+t.closest('[data-row]').dataset.row);r.name=t.value.trim()||t.dataset.original;t.value=r.name}});document.addEventListener('keydown',e=>{let t=e.target;if(t.matches('[contenteditable],[data-edit="name"]')){if(e.key==='Escape'){e.preventDefault();if('value'in t)t.value=t.dataset.original;else t.textContent=t.dataset.original;t.blur()}if(e.key==='Enter'){e.preventDefault();t.blur()}}});
$('#collapse').onclick=()=>document.body.classList.toggle('collapsed');$('#newBoard').onclick=async ()=>{let name=await ask('새 보드 이름','');if(name?.trim()){let b={id:++serial,name:name.trim(),favorite:true,columns:[],groups:[]};boards.push(b);showBoard(b.id)}};$('#columnForm').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target);board().columns.push({id:++serial,name:f.get('name'),kind:f.get('kind')});columnDialog.close();e.target.reset();render()};function drawer(r){$('.drawer')?.remove();let d=document.createElement('section');d.className='drawer';d.innerHTML=`<button class="right" id="closeDrawer">닫기</button><h2>${esc(r.name)}</h2><p class="description">업데이트 · 댓글</p><div id="feed">${r.comments.map(t=>`<p>김현우<br>${esc(t)}</p>`).join('')}</div><textarea id="commentText" aria-label="업데이트 내용" placeholder="업무 진행 내용이나 의견을 남기세요"></textarea><button class="primary" id="sendComment">등록</button>`;document.body.append(d);$('#closeDrawer').onclick=()=>d.remove();$('#sendComment').onclick=()=>{let t=$('#commentText').value.trim();if(t){r.comments.push(t);render();drawer(r)}}}
function trash(){ $('.drawer')?.remove();let d=document.createElement('section');d.className='drawer';d.innerHTML='<button id="closeDrawer">닫기</button><h2>보관·휴지통</h2><p class="description">복구하면 기존 값도 함께 돌아옵니다.</p>';const entries=[...board().groups.filter(g=>g.deleted||g.archived),...board().groups.flatMap(g=>[...g.rows,...g.rows.flatMap(r=>r.children)]).filter(r=>r.deleted||r.archived),...board().columns.filter(c=>c.deleted)];for(const x of entries){let p=document.createElement('p');p.textContent=x.name+' ';let b=document.createElement('button');b.textContent='복구';b.onclick=()=>{x.deleted=false;x.archived=false;render();trash()};p.append(b);d.append(p)}if(!entries.length)d.append('보관·삭제된 항목이 없습니다.');document.body.append(d);$('#closeDrawer').onclick=()=>d.remove()}
let companies=[];function renderUsers(){$('#content').innerHTML=`<h1>사용자 관리</h1><p class="description">총 관리자 · 모든 회사의 사용자 계정을 관리합니다.</p><div class="notice">회사·계정은 검토 탭에만 표시됩니다. 실제 비밀번호는 입력하지 마세요.</div>${companies.length?companies.map(c=>`<section class="group scroll empty"><h3>${esc(c)}</h3><p>첫 회사 관리자 계정 등록 예시</p><button data-demo-user>＋ 사용자 추가</button></section>`).join(''):'<section class="scroll empty"><h3>등록된 회사가 없습니다.</h3><p>회사를 등록하면 해당 회사의 사용자를 추가할 수 있습니다.</p></section>'}<p><button class="primary" id="companyAdd">＋ 회사 등록</button></p>`;$('#companyAdd').onclick=async ()=>{let name=await ask('검토용 회사명 (실제 저장 없음)','');if(name?.trim()){companies.push(name.trim());renderUsers()}};document.querySelectorAll('[data-demo-user]').forEach(b=>b.onclick=()=>toast('제품 구현에서는 아이디·이름·비밀번호·근무 역할 입력 폼을 엽니다.'))}render();
</script></html>
