<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Factory Studio · 화면 설계</title>
<style>
:root{font-family:Inter,-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo',sans-serif;color:#243247;background:#f4f3f8;font-synthesis:none}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer}button:focus-visible,a:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid #157d87;outline-offset:4px}button{border:0;background:none;color:inherit}header{height:76px;background:#ffffffc9;border-bottom:1px solid #e3e2eb;display:flex;align-items:center;justify-content:space-between;padding:0 5%;gap:18px}.brand{font-size:19px;font-weight:750;display:flex;align-items:center;gap:12px}.mark{background:#286a68;color:white;padding:9px 12px;border-radius:12px}.context{font-size:13px;color:#667085}.avatar{display:inline-grid;place-items:center;width:34px;height:34px;background:#e4ddee;border-radius:50%;margin-left:15px}main{max-width:1200px;margin:auto;padding:35px 30px 60px}h1{font-size:30px;letter-spacing:-1px;margin:8px 0 14px}h2{font-size:20px}h3{font-size:16px}p{line-height:1.65}small,.muted{color:#687386}.eyebrow{font-size:12px;letter-spacing:1.5px;color:#557472;font-weight:700}.notice{font-size:12px;color:#687386;margin-bottom:28px}.hero{display:flex;justify-content:space-between;gap:20px;align-items:center}.pill{display:inline-block;padding:6px 10px;background:#e4f1ed;color:#256658;border-radius:20px;font-size:12px}.resume{margin:24px 0 30px;padding:20px 24px;border:1px solid #d9e5e3;background:#edf5f3;border-radius:14px;display:flex;justify-content:space-between;align-items:center;gap:18px}.primary{background:#286a68;color:white;padding:12px 18px;border-radius:9px;font-weight:600}.secondary{border:1px solid #d5dbe2;border-radius:9px;padding:10px 14px;background:white}.search{border:1px solid #d9dce5;border-radius:9px;background:#fff;padding:11px 14px;width:240px}.apps{display:grid;grid-template-columns:repeat(6,1fr);gap:35px 22px;margin:35px 0 58px}.app{display:flex;flex-direction:column;align-items:center;gap:12px;padding:10px 0;border-radius:14px}.app:hover{background:#ffffff80}.icon{height:86px;width:86px;border:1px solid #e2e1e8;border-radius:19px;background:white;box-shadow:0 5px 12px #34405409;display:grid;place-items:center}.icon svg{width:49px;height:49px}.app b{font-size:15px}.app small{font-size:11px}.future{display:flex;gap:25px;border-top:1px solid #dedee7;padding-top:22px;align-items:center;color:#707a8a;font-size:13px}.crumb{margin-bottom:22px;display:flex;gap:14px;align-items:center;font-size:13px}.crumb button{color:#286a68}.layout{display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:24px}.panel{border:1px solid #e0e4e9;background:white;border-radius:14px;padding:24px;margin-bottom:18px}.panel h2:first-child{margin-top:0}.steps{display:flex;gap:8px;margin:22px 0;flex-wrap:wrap}.step{padding:9px 12px;background:#e8ebf1;border-radius:8px;font-size:12px}.step.done{background:#e4f1ed}.step.current{background:#286a68;color:white}.meta{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;border-bottom:1px solid #e6e8ed;padding-bottom:20px;margin-bottom:24px}.meta strong{display:block;margin-top:7px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:18px}label{display:block;font-size:14px}label input,label select{width:100%;padding:12px;border:1px solid #cfd6df;border-radius:8px;margin-top:8px;background:white}label.full{grid-column:1/-1}.actions{display:flex;gap:12px;align-items:center;margin-top:22px;flex-wrap:wrap}.error{color:#ad3737;background:#fff1ef;padding:12px;border-radius:8px;margin-top:15px}.help p,.help li{font-size:14px;line-height:1.8}.help ul{padding-left:20px}summary{cursor:pointer;font-weight:650;padding:10px 0}.result{font-size:38px;font-weight:700;color:#286a68}.module{display:flex;align-items:center;justify-content:space-between;gap:18px;padding:18px 0;border-bottom:1px solid #e5e7ee}.module p{margin:5px 0;font-size:13px}.footer{margin-top:32px;color:#7b8493;font-size:12px}.course{display:flex;gap:18px;align-items:center}.course .icon{flex-shrink:0}a{color:#286a68}.off{opacity:.65}button:disabled{cursor:not-allowed;opacity:.5}.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#243247;color:white;padding:14px 22px;border-radius:10px;max-width:90%;z-index:5}.hidden{display:none}@media(max-width:850px){.apps{grid-template-columns:repeat(3,1fr)}.layout{grid-template-columns:1fr}.context{display:none}.hero{align-items:flex-start;flex-direction:column}.search{width:100%}}@media(max-width:480px){header{padding:0 20px;height:66px}main{padding:25px 18px}.brand{font-size:17px}.apps{gap:24px 10px}.icon{width:72px;height:72px}.app b{font-size:13px}.resume{padding:18px;align-items:flex-start;flex-direction:column}.fields{grid-template-columns:1fr}.meta{grid-template-columns:1fr 1fr}.panel{padding:18px}.future{flex-wrap:wrap;gap:15px}h1{font-size:25px}}
</style>
<header><button class="brand" onclick="go('home')" aria-label="Factory Studio 앱 홈"><span class="mark">F</span>Factory Studio</button><div><span class="context">가상 후공정 사업장 &nbsp; / &nbsp; 나의 체험 공간</span><span class="avatar" aria-label="학습자">김</span></div></header><main id="root"></main><div id="toast" class="toast hidden" role="status"></div>
<script>
const icons={learn:'<path d="M8 12h18v37H8z" fill="#edb358"/><path d="M28 12h18v37H28z" fill="#836bae"/><path d="M13 21h9m-9 8h9m10-8h9m-9 8h9" stroke="white" stroke-width="3"/>',mes:'<path d="M6 25l15-10v10l15-10v10h12v25H6z" fill="#4e9395"/><path d="M36 8h8v20h-8z" fill="#aacdcb"/><path d="M14 34h7v8h-7zm15 0h7v8h-7z" fill="white"/>',fems:'<path d="M31 4L10 32h16l-3 20 23-30H30z" fill="#e6ab40"/>',bems:'<path d="M13 6h28v46H13z" fill="#7688bf"/><path d="M20 14h5v6h-5zm10 0h5v6h-5zm-10 12h5v6h-5zm10 0h5v6h-5z" fill="white"/><path d="M24 40h7v12h-7z" fill="#cbd2e8"/>',dash:'<rect x="6" y="8" width="19" height="19" rx="4" fill="#6995b4"/><rect x="30" y="8" width="19" height="31" rx="4" fill="#b29ac7"/><rect x="6" y="32" width="19" height="17" rx="4" fill="#6caaa0"/><rect x="30" y="44" width="19" height="5" rx="2" fill="#e4b574"/>',modules:'<path d="M6 7h18v18H6zm25 0h18v18H31zM6 32h18v18H6z" fill="#a080b4"/><path d="M31 40h18m-9-9v18" stroke="#5a9f98" stroke-width="6"/>'};
const icon=k=>`<span class="icon"><svg viewBox="0 0 56 56" aria-hidden="true">${icons[k]}</svg></span>`;
const apps=[['learn','학습 시작','나의 학습 경로'],['mes','MES','생산 실행'],['fems','FEMS','제조 에너지'],['bems','BEMS','건물 에너지'],['dash','통합 대시보드','업무 연결'],['modules','모듈 관리','앱 선택']];
let page='home',done=false,started=false,mode='guided',enabled={mes:true,fems:true,bems:true},draft={good:'995',bad:'5',reason:'접착 불량'},message='';
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function go(p){page=p;message='';render();window.scrollTo(0,0);document.querySelector('h1')?.focus()}
function notify(s){const t=document.getElementById('toast');t.textContent=s;t.classList.remove('hidden');setTimeout(()=>t.classList.add('hidden'),4000)}
function heading(k,title,sub){return `<div class="eyebrow">${k}</div><h1 tabindex="-1">${title}</h1><p class="muted">${sub}</p>`}
function crumbs(name){return `<nav class="crumb" aria-label="현재 위치"><button onclick="go('home')">앱 홈</button><span>/</span><span>${name}</span></nav>`}
function render(){let html='<div class="notice">화면 설계 시제품 · 모든 값은 가상 예시이며 새로고침하면 초기 상태로 돌아갑니다.</div>';
if(page==='home'){html+=`<div class="hero"><div>${heading('YOUR WORKSPACE','업무를 이해하는 첫걸음','앱에서 직접 해보고, 연결된 업무의 흐름을 배워보세요.')}</div><input class="search" aria-label="앱 검색" placeholder="앱 이름으로 검색" oninput="filterApps(this.value)"></div><div class="resume"><div><small>학습 이어하기 · MES 기초</small><h3>${done?'다이 접착 결과를 확인했어요':'다이 접착 실적을 기록해볼까요?'}</h3><span class="muted">${done?'다음 단계: 와이어 본딩 · 투입 가능 995 EA':'준비 · 작업지시 · LOT까지 완료된 예시입니다. (3 / 7)'}</span></div><button class="primary" onclick="mode='guided';go('mes')">${done?'결과 확인':'이어서 실습하기'} →</button></div><div class="apps" id="apps">${apps.map(([k,n,s])=>`<button class="app" data-name="${n} ${s}" onclick="${k==='mes'?"mode='free';":''}go('${k}')">${icon(k)}<b>${n}</b><small>${enabled[k]===false?'사용 꺼짐':s}</small></button>`).join('')}</div><p id="empty" class="hidden muted">일치하는 앱이 없습니다.</p><div class="future"><b>다음에 만날 앱</b><span>QMS · 품질</span><span>WMS · 재고</span><span>ERP · 경영</span><span class="pill">준비 중</span></div>`}
else if(page==='learn'){html+=crumbs('학습 시작')+heading('LEARNING PATH','한 건의 생산을 끝까지','무엇이 필요한지부터, 결과가 어디로 이어지는지까지 알아봅니다.')+`<div class="panel course">${icon('learn')}<div><span class="pill">입문 · 약 10–15분 목표</span><h2>작업지시에서 생산 완료까지</h2><p class="muted">MES-FOUNDATION-01 · 과정 v1.0 · 7개 단계<br>준비 → 지시 발행 → LOT → 다이 접착 → 본딩 → 검사 → 결과 해석</p><button class="primary" onclick="mode='guided';go('mes')">${done?'결과 확인':'L04 이어하기'} →</button></div></div><div class="panel"><h3>지금 필요한 것</h3><p>품목 PKG-DEMO · 기준단위 EA · 공정 경로 v1 · 설비 DA-01</p><p class="muted">이 시제품은 L01~L03 완료 상태에서 시작합니다. 실제 과정은 준비정보 확인부터 진행합니다.</p></div>`}
else if(page==='mes'){html+=crumbs('MES / 공정 실행');if(!enabled.mes){html+=heading('MES','MES가 꺼져 있습니다','실습을 이어가려면 모듈 관리에서 MES를 켜주세요.')+`<button class="primary" onclick="go('modules')">모듈 관리로 이동</button>`}else{html+=heading(mode==='guided'?'GUIDED PRACTICE · L04 / 7':'MES · FREE EXPLORATION','다이 접착',mode==='guided'?'첫 공정의 투입 수량이 양품과 불량으로 어떻게 나뉘는지 확인합니다.':'같은 업무 화면에서 자유롭게 살펴봅니다. 예시 작업은 기존 학습 시도에 연결되어 있습니다.');html+=`<div class="steps">${['준비','지시 발행','LOT 생성','다이 접착','와이어 본딩','최종 검사','결과 해석'].map((n,i)=>`<span class="step ${i<3||i===3&&done?'done':i===3?'current':''}">${i<3||i===3&&done?'✓':i+1} ${n}</span>`).join('')}</div><div class="layout"><section><div class="panel"><div class="meta"><div><small>작업지시 / LOT</small><strong>WO-001 / LOT-001</strong></div><div><small>설비</small><strong>DA-01</strong></div><div><small>투입 수량</small><strong>1,000 EA</strong></div></div>${done?`<span class="pill">공정 완료 · 시제품 예시</span><h2>다음 공정에 전달할 양품</h2><div class="result">${esc(draft.good)} <small>EA</small></div><p>불량 ${esc(draft.bad)} EA · ${esc(draft.reason)}</p><p class="muted">생산실적을 확인한 상태입니다. 전체 과정의 학습 완료를 의미하지 않습니다.</p><div class="actions"><button class="primary" onclick="go('next')">다음 업무 확인 →</button><button class="secondary" onclick="go('learn')">학습 경로</button></div>`:`<span class="pill">${started?'공정 진행 중':'시작 전'}</span><h2>생산실적 입력</h2><p class="muted">과제: 양품 995 EA, 불량 5 EA. 양품 + 불량은 투입 수량과 같아야 합니다.</p><form onsubmit="submitResult(event)"><div class="fields"><label>양품 (EA)<input id="good" type="number" min="0" step="1" required value="${esc(draft.good)}" oninput="draft.good=this.value"></label><label>불량 (EA)<input id="bad" type="number" min="0" step="1" required value="${esc(draft.bad)}" oninput="draft.bad=this.value"></label><label class="full">불량 사유<input id="reason" value="${esc(draft.reason)}" oninput="draft.reason=this.value" placeholder="불량이 있으면 사유를 입력하세요"></label></div><div id="error" role="alert" class="${message?'error':'hidden'}">${esc(message)}</div><div class="actions">${started?'<button class="primary" type="submit">실적 확정 · 예시</button>':'<button class="primary" type="button" onclick="started=true;render()">공정 시작 · 예시</button>'}<button class="secondary" type="button" onclick="go('learn')">학습 경로 보기</button></div></form>`}</div></section><aside class="panel help"><span class="eyebrow">LEARNING COMPANION</span><h2>이 업무가 궁금하다면</h2><details open><summary>왜 기록하나요?</summary><p>양품은 다음 공정의 투입 기준이 되고, 불량은 수량이 줄어든 이유를 설명합니다.</p></details><details open><summary>먼저 확인할 것</summary><ul><li>발행된 작업지시와 연결 LOT</li><li>다이 접착에 맞는 설비 DA-01</li><li>투입 수량 1,000 EA</li></ul></details><details><summary>어떤 순서로 하나요?</summary><p>공정 시작 → 수량·사유 입력 → 실적 확정 → 다음 투입 수량 확인</p></details><details><summary>자주 생기는 오류</summary><p>수량 합계가 다르거나 불량 사유가 없으면 확정할 수 없습니다. 확정한 실적은 이 화면에서 덮어쓰지 않습니다.</p></details><details><summary>다음 업무는 무엇인가요?</summary><p>와이어 본딩에서는 이번 공정의 양품만 투입합니다. 창고 입고는 별도의 WMS 업무입니다.</p></details></aside></div>`}}
else if(page==='next'){html+=crumbs('다음 업무')+heading('NEXT STEP','와이어 본딩으로 연결됩니다',`이번 공정 양품 ${draft.good} EA가 다음 투입의 근거가 됩니다.`)+`<div class="panel"><h2>다이 접착 → 와이어 본딩 → 최종 검사</h2><p>예정 과제: 투입 995 / 양품 990 / 불량 5 EA</p><p class="muted">이 화면은 연결 설명입니다. L05 실행과 전체 학습 완료 검증은 실제 구현 단계에서 제공합니다.</p><button class="secondary" onclick="go('mes')">확정 결과로 돌아가기</button></div>`}
else if(page==='modules'){html+=crumbs('모듈 관리')+heading('YOUR APPS','필요한 앱을 선택하세요','앱을 꺼도 데이터와 학습 기록은 삭제되지 않습니다.')+`<div class="panel"><div class="module"><div><b>공통 기능 · 학습</b><p class="muted">계정, 체험 공간, 학습 경로 · 항상 사용</p></div><span class="pill">필수</span></div>${['mes','fems','bems'].map(k=>`<div class="module"><div><b>${k.toUpperCase()}</b><p class="muted">${k==='mes'?'발행 지시가 있으면 끌 수 없습니다.':'독립 사용 가능 · MES를 켜면 생산과 연결합니다.'}</p></div><button class="secondary" aria-pressed="${enabled[k]}" onclick="toggle('${k}')">${enabled[k]?'켜짐 → 끄기':'꺼짐 → 켜기'}</button></div>`).join('')}<p id="moduleMessage" role="status" class="muted">변경은 현재 시제품 탭에서만 유지됩니다.</p></div>`}
else {const names={fems:'제조 에너지',bems:'건물 에너지',dash:'통합 대시보드'};html+=crumbs(names[page])+heading('CONNECTED WORK',names[page],'생산과 계측의 연결을 살펴보는 후속 화면입니다.')+`<div class="panel"><h2>${page==='fems'?'생산 수량 → 사용 전력량 → 원단위':page==='bems'?'제조 사용량 + 공용 사용량 + 미계측 잔여':'생산 → 제조 에너지 → 건물 전체'}</h2><p>이 단계에서는 화면 진입과 업무 연결만 설계합니다. 계측 조회·계산·위젯 편집은 아직 제공하지 않습니다.</p><span class="pill">${enabled[page]===false?'모듈 꺼짐':'상세 화면 설계 예정'}</span><div class="actions"><button class="secondary" onclick="go('modules')">모듈 관리</button><button class="secondary" onclick="go('home')">앱 홈</button></div></div>`}
document.getElementById('root').innerHTML=html+'<div class="footer">Factory Studio · FS-008 UI Prototype · 외부 서비스 및 DB 연결 없음</div>'}
function filterApps(v){let n=0;document.querySelectorAll('.app').forEach(e=>{const show=e.dataset.name.toLowerCase().includes(v.toLowerCase());e.style.display=show?'flex':'none';if(show)n++});document.getElementById('empty').classList.toggle('hidden',n>0)}
function submitResult(e){e.preventDefault();if(!started||done)return;const g=Number(draft.good),b=Number(draft.bad);message=!draft.good||!draft.bad||!Number.isInteger(g)||!Number.isInteger(b)||g<0||b<0?'EA는 0 이상의 정수로 입력하세요.':g+b!==1000?'양품과 불량의 합계가 투입 1,000 EA와 다릅니다. 수량을 수정하세요.':b>0&&!draft.reason.trim()?'불량 사유를 입력하세요.':g!==995||b!==5?'업무 수량 합계는 유효하지만 이 시제품의 과제는 995 / 5 EA입니다. 자유 수량 저장은 실제 구현에서 제공합니다.':'';if(!message)done=true;render();if(message)document.getElementById('error').scrollIntoView({block:'center'})}
function toggle(k){if(k==='mes'&&enabled.mes){document.getElementById('moduleMessage').textContent='MES를 끌 수 없습니다: 발행된 작업지시 WO-001이 아직 전체 완료되지 않았습니다. 먼저 진행 업무를 마쳐주세요.';return}enabled[k]=!enabled[k];render();notify(k.toUpperCase()+' 설정을 변경했습니다. 데이터는 유지됩니다.')}
render();
</script></html>
